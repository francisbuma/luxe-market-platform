<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LuxeMarket</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #2563eb; --primary-dark: #1d4ed8; --secondary: #f59e0b;
            --dark: #1f2937; --light: #f3f4f6; --white: #ffffff;
            --gray: #6b7280; --success: #10b981; --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
        }
        .auth-container {
            background: var(--white); border-radius: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%; max-width: 420px; padding: 2.5rem;
        }
        .auth-header { text-align: center; margin-bottom: 2rem; }
        .auth-header .logo { font-size: 2rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        .auth-header h1 { font-size: 1.5rem; margin-top: 0.5rem; color: var(--dark); }
        .auth-header p { color: var(--gray); margin-top: 0.25rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--dark); font-size: 0.875rem; }
        .form-group input {
            width: 100%; padding: 0.875rem 1rem; border: 2px solid var(--light); border-radius: 0.5rem;
            font-size: 1rem; transition: border-color 0.3s;
        }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .form-group input.error { border-color: var(--danger); background: #fef2f2; }
        .btn {
            width: 100%; padding: 0.875rem; border: none; border-radius: 0.5rem;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-footer { text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--light); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .error-msg { background: #fef2f2; color: var(--danger); padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; display: none; border-left: 3px solid var(--danger); }
        .success-msg { background: #ecfdf5; color: var(--success); padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; display: none; border-left: 3px solid var(--success); }
        .info-msg { background: #eff6ff; color: var(--primary); padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; font-size: 0.875rem; display: none; border-left: 3px solid var(--primary); }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--gray); text-decoration: none; margin-bottom: 1.5rem; font-size: 0.875rem; }
        .back-link:hover { color: var(--dark); }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .lang-bar { display: flex; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
        .lang-chip { padding: 0.375rem 0.75rem; border-radius: 2rem; font-size: 0.875rem; cursor: pointer; border: 1px solid var(--light); background: white; transition: all 0.2s; }
        .lang-chip:hover { background: var(--light); }
        .lang-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .server-status { text-align: center; padding: 0.5rem; margin-bottom: 1rem; border-radius: 0.5rem; font-size: 0.875rem; }
        .server-status.online { background: #ecfdf5; color: var(--success); }
        .server-status.offline { background: #fef2f2; color: var(--danger); }
        .server-status.checking { background: #eff6ff; color: var(--primary); }
    </style>
</head>
<body>
    <div class="auth-container">
        <a href="/" class="back-link">← <span data-i18n="back_to_shop">Back to Shop</span></a>

        <div class="lang-bar" id="langBar"></div>

        <div class="server-status checking" id="serverStatus">Checking server...</div>
        <div id="redirectFallback" style="display:none;text-align:center;margin-top:0.5rem;"><a id="redirectLink" href="#">Alternative Anmeldung verwenden</a></div>

        <div class="auth-header">
            <div class="logo">LuxeMarket</div>
            <h1 data-i18n="login_title">Welcome Back</h1>
            <p data-i18n="login_subtitle">Sign in to continue</p>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <div class="info-msg" id="infoMsg"></div>
        <form id="loginForm" action="/api/auth/login" method="POST" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email" data-i18n="login_email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password" data-i18n="login_password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Your password" minlength="6" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn" data-i18n="login_button">Sign In</button>
        </form>
        <div class="auth-footer">
            <p><span data-i18n="no_account">No account?</span> <a href="register.html" data-i18n="register_now">Register now</a></p>
        </div>
    </div>

    <script src="/assets/safe-dom.js"></script>
    <script>
        const APP_BASE = window.location.protocol === 'file:' ? 'http://localhost:8080' : window.location.origin;
        const FALLBACK_I18N = {
            currentLang: 'en',
            translations: {
                en: {
                    back_to_shop: 'Back to Shop',
                    login_title: 'Welcome Back',
                    login_subtitle: 'Sign in to continue',
                    login_email: 'Email Address',
                    login_password: 'Password',
                    login_button: 'Sign In',
                    no_account: 'No account?',
                    register_now: 'Register now'
                }
            },
            t(key) {
                return this.translations[this.currentLang]?.[key] || this.translations.en[key] || key;
            }
        };
        window.I18N = window.I18N || FALLBACK_I18N;
        const API_BASE = `${APP_BASE}/api`;
        let serverOnline = null;

        function setSubmitState(button, isBusy, loadingText, idleText) {
            button.disabled = isBusy;
            button.textContent = '';
            if (isBusy) {
                const spinner = document.createElement('span');
                spinner.className = 'spinner';
                button.appendChild(spinner);
            }
            button.appendChild(document.createTextNode(isBusy ? loadingText : idleText));
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLangBar();
            applyTranslations();
            checkServerStatus();
        });

        function safeTranslate(key, fallback = '') {
            if (window.I18N && typeof window.I18N.t === 'function') {
                return window.I18N.t(key);
            }
            return fallback || key;
        }

        async function checkServerStatus() {
            const statusEl = document.getElementById('serverStatus');
            statusEl.className = 'server-status checking';
            statusEl.textContent = 'Checking server...';

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                const isFileOrigin = window.location.protocol === 'file:';
                const res = await fetch(`${API_BASE}/health`, {
                    signal: controller.signal,
                    ...(isFileOrigin ? { mode: 'no-cors' } : {})
                });
                clearTimeout(timeout);

                if (isFileOrigin || res.ok) {
                    serverOnline = true;
                    statusEl.className = 'server-status online';
                    statusEl.textContent = '✅ Server online';
                    setTimeout(() => statusEl.style.display = 'none', 2000);
                    const fb = document.getElementById('redirectFallback'); if (fb) fb.style.display = 'none';
                } else {
                    throw new Error('Server error');
                }
            } catch (e) {
                serverOnline = false;
                statusEl.className = 'server-status offline';
                statusEl.textContent = '⚠️ Server offline - please start the server with "npm start"';
                showInfo('Please start the server first: npm start');
                const fb = document.getElementById('redirectFallback'); if (fb) { fb.style.display = 'block'; const link = document.getElementById('redirectLink'); if (link) link.href = `${APP_BASE}/redirect`; }
            }
        }

        function initLangBar() {
            const bar = document.getElementById('langBar');
            if (!bar) return;
            const i18n = window.I18N;
            const current = i18n && typeof i18n.getCurrentLang === 'function' ? i18n.getCurrentLang() : { code: 'en' };
            const languages = i18n && Array.isArray(i18n.getLanguages?.()) ? i18n.getLanguages() : [{ code: 'en', name: 'English', flag: '🇬🇧' }];
            bar.innerHTML = languages.map(lang => 
                `<button class="lang-chip ${lang.code === current.code ? 'active' : ''}" onclick="changeLang('${SafeDOM.escapeAttribute(lang.code)}')">${SafeDOM.escapeHtml(lang.flag)} ${SafeDOM.escapeHtml(lang.name)}</button>`
            ).join('');
        }

        function changeLang(lang) {
            if (window.I18N && typeof window.I18N.setLang === 'function') {
                window.I18N.setLang(lang);
            }
            document.querySelectorAll('.lang-chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent.includes(lang));
            });
            applyTranslations();
        }

        function applyTranslations() {
            const i18n = window.I18N;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                let text = key;
                if (i18n && typeof i18n.t === 'function') {
                    text = i18n.t(key) || key;
                }
                if (text === key && key.includes('_')) {
                    text = key.split('_').slice(1).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                }
                if (el.tagName === 'INPUT') el.placeholder = text;
                else el.textContent = text;
            });
            if (i18n && i18n.currentLang) {
                document.documentElement.lang = i18n.currentLang;
            }
        }

        function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; document.getElementById('successMsg').style.display = 'none'; document.getElementById('infoMsg').style.display = 'none'; }
        function showSuccess(msg) { const el = document.getElementById('successMsg'); el.textContent = msg; el.style.display = 'block'; document.getElementById('errorMsg').style.display = 'none'; document.getElementById('infoMsg').style.display = 'none'; }
        function showInfo(msg) { const el = document.getElementById('infoMsg'); el.textContent = msg; el.style.display = 'block'; }
        function clearMessages() { document.getElementById('errorMsg').style.display = 'none'; document.getElementById('successMsg').style.display = 'none'; document.getElementById('infoMsg').style.display = 'none'; }

        function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
        function validatePassword(password) { return password.length >= 6; }

        async function handleLogin(e) {
            e.preventDefault();
            clearMessages();

            if (serverOnline === false) { showError('Server is offline. Please start the server first.'); return; }

            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Client-side validation
            if (!email) { showError('Email is required'); document.getElementById('email').classList.add('error'); return; }
            if (!validateEmail(email)) { showError('Please enter a valid email address'); document.getElementById('email').classList.add('error'); return; }
            if (!password) { showError('Password is required'); document.getElementById('password').classList.add('error'); return; }
            if (!validatePassword(password)) { showError('Password must be at least 6 characters'); document.getElementById('password').classList.add('error'); return; }

            document.getElementById('email').classList.remove('error');
            document.getElementById('password').classList.remove('error');

            if (btn.dataset.busy === 'true') return;
            btn.dataset.busy = 'true';
            setSubmitState(btn, true, I18N.t('login_loading'), I18N.t('login_button'));

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);
                const res = await fetch(`${API_BASE}/session/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }), signal: controller.signal,
                    credentials: 'include'
                });
                clearTimeout(timeout);

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    const guestCart = JSON.parse(localStorage.getItem('guestCart') || '[]');
                    if (guestCart.length > 0) {
                        try {
                            await fetch(`${API_BASE}/cart/sync`, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ items: guestCart.map(item => ({ productId: item.productId, quantity: item.quantity })) }),
                                credentials: 'include'
                            });
                            localStorage.removeItem('guestCart');
                        } catch (e) { console.log('Cart sync failed, continuing anyway'); }
                    }
                    if (data.token) localStorage.setItem('token', data.token);
                    btn.dataset.busy = 'false';
                    setSubmitState(btn, false, I18N.t('login_loading'), I18N.t('login_button'));
                    showSuccess('Login successful! Redirecting...');
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get('redirect');
                    const targetPath = redirect === 'checkout' ? '/' : '/pages/dashboard.html';
                    setTimeout(() => {
                        window.location.assign(new URL(targetPath, APP_BASE).toString());
                    }, 1000);
                } else {
                    btn.dataset.busy = 'false';
                    setSubmitState(btn, false, I18N.t('login_loading'), I18N.t('login_button'));
                    showError(data.error || 'Invalid email or password');
                }
            } catch (err) {
                btn.dataset.busy = 'false';
                setSubmitState(btn, false, I18N.t('login_loading'), I18N.t('login_button'));
                if (err.name === 'AbortError') showError('Request timed out. Please try again.');
                else showError('Cannot connect to server. Please make sure the server is running.');
            }
        }
    </script>
</body>
</html>
