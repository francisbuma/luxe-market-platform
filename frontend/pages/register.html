<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LuxeMarket</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #f59e0b;
            --dark: #1f2937;
            --light: #f3f4f6;
            --white: #ffffff;
            --gray: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-container {
            background: var(--white);
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            margin-top: 0.5rem;
            color: var(--dark);
        }

        .auth-header p {
            color: var(--gray);
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--light);
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.3s, background 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group input.error {
            border-color: var(--danger);
            background: #fef2f2;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--light);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: #fef2f2;
            color: var(--danger);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
            border-left: 3px solid var(--danger);
        }

        .success-msg {
            background: #ecfdf5;
            color: var(--success);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
            border-left: 3px solid var(--success);
        }

        .info-msg {
            background: #eff6ff;
            color: var(--primary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
            border-left: 3px solid var(--primary);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gray);
            text-decoration: none;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .back-link:hover {
            color: var(--dark);
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .lang-bar {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .lang-chip {
            padding: 0.375rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.875rem;
            cursor: pointer;
            border: 1px solid var(--light);
            background: white;
            transition: all 0.2s;
        }

        .lang-chip:hover {
            background: var(--light);
        }

        .lang-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .server-status {
            text-align: center;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        .server-status.online {
            background: #ecfdf5;
            color: var(--success);
        }

        .server-status.offline {
            background: #fef2f2;
            color: var(--danger);
        }

        .server-status.checking {
            background: #eff6ff;
            color: var(--primary);
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 0.5rem;
            transition: all 0.3s;
        }

        .password-strength.weak {
            background: var(--danger);
            width: 33%;
        }

        .password-strength.medium {
            background: var(--warning);
            width: 66%;
        }

        .password-strength.strong {
            background: var(--success);
            width: 100%;
        }

        .avatar-upload {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--light);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border: 3px dashed var(--light);
            cursor: pointer;
            transition: all 0.3s;
        }

        .avatar-preview:hover {
            border-color: var(--primary);
        }

        .avatar-preview.has-image {
            border-style: solid;
            border-color: var(--primary);
        }

        .avatar-upload input {
            display: none;
        }

        .avatar-upload label {
            cursor: pointer;
            display: inline-block;
        }

        .avatar-upload .hint {
            font-size: 0.75rem;
            color: var(--gray);
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <a href="/" class="back-link">← <span data-i18n="back_to_shop">Back to Shop</span></a>

        <div class="lang-bar" id="langBar"></div>

        <div class="server-status checking" id="serverStatus">Checking server...</div>

        <div class="auth-header">
            <div class="logo">LuxeMarket</div>
            <h1 data-i18n="register_title">Create Account</h1>
            <p data-i18n="register_subtitle">Register for a better shopping experience</p>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>
        <div class="info-msg" id="infoMsg"></div>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="avatar-upload">
                <label for="avatarInput">
                    <div class="avatar-preview" id="avatarPreview">📷</div>
                </label>
                <input type="file" name="avatar" id="avatarInput" accept="image/*" onchange="handleAvatarChange(event)">
                <div class="hint" data-i18n="register_avatar_hint">Click to upload profile photo (max 500KB)</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName" data-i18n="register_firstname">First Name *</label>
                    <input type="text" name="firstName" id="firstName" required placeholder="John"
                        autocomplete="given-name">
                </div>
                <div class="form-group">
                    <label for="lastName" data-i18n="register_lastname">Last Name *</label>
                    <input type="text" name="lastName" id="lastName" required placeholder="Doe"
                        autocomplete="family-name">
                </div>
            </div>
            <div class="form-group">
                <label for="email" data-i18n="login_email">Email Address *</label>
                <input type="email" name="email" id="email" required placeholder="john@example.com"
                    autocomplete="email">
            </div>
            <div class="form-group">
                <label for="phone" data-i18n="register_phone">Phone (optional)</label>
                <input type="tel" name="phone" id="phone" placeholder="+1 555 123 4567" autocomplete="tel">
            </div>
            <div class="form-group">
                <label for="password" data-i18n="register_password">Password * (min. 6 characters)</label>
                <input type="password" name="password" id="password" required minlength="6"
                    placeholder="Secure password" autocomplete="new-password" oninput="checkPasswordStrength()">
                <div class="password-strength" id="passwordStrength"></div>
            </div>
            <div class="form-group">
                <label for="passwordConfirm" data-i18n="register_confirm">Confirm Password *</label>
                <input type="password" name="passwordConfirm" id="passwordConfirm" required minlength="6"
                    placeholder="Repeat password" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary" name="registerBtn" id="registerBtn"
                data-i18n="register_button">Create Account</button>
        </form>
        <div class="auth-footer">
            <p><span data-i18n="has_account">Already registered?</span> <a href="login.html" data-i18n="login_here">Sign
                    in here</a></p>
        </div>
    </div>

    <script src="/assets/safe-dom.js"></script>
    <script>
        const APP_BASE = window.location.protocol === 'file:' ? 'http://localhost:8180' : window.location.origin;
        const FALLBACK_I18N = {
            currentLang: 'en',
            translations: {
                en: {
                    back_to_shop: 'Back to Shop',
                    register_title: 'Create Account',
                    register_subtitle: 'Register for a better shopping experience',
                    login_email: 'Email Address',
                    register_phone: 'Phone (optional)',
                    register_avatar_hint: 'Click to upload profile photo (max 500KB)',
                    register_password: 'Password (min. 6 characters)',
                    register_confirm: 'Confirm Password',
                    register_button: 'Create Account',
                    has_account: 'Already registered?',
                    login_here: 'Sign in here'
                }
            },
            t(key) {
                return this.translations[this.currentLang]?.[key] || this.translations.en[key] || key;
            }
        };
        window.I18N = window.I18N || FALLBACK_I18N;
        const API_BASE = `${APP_BASE}/api`;
        let serverOnline = false;

        function setSubmitState(button, isBusy, loadingText, idleText) {
            button.disabled = isBusy;
            button.textContent = '';
            if (isBusy) {
                const spinner = document.createElement('span');
                spinner.className = 'spinner';
                button.appendChild(spinner);
            }
            button.appendChild(document.createTextNode(isBusy ? loadingText : idleText));
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLangBar();
            applyTranslations();
            checkServerStatus();
        });

        async function checkServerStatus() {
            const statusEl = document.getElementById('serverStatus');
            statusEl.className = 'server-status checking';
            statusEl.textContent = 'Checking server...';

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 5000);
                const isFileOrigin = window.location.protocol === 'file:';
                const res = await fetch(`${API_BASE}/health`, {
                    signal: controller.signal,
                    ...(isFileOrigin ? { mode: 'no-cors' } : {})
                });
                clearTimeout(timeout);

                if (isFileOrigin || res.ok) {
                    serverOnline = true;
                    statusEl.className = 'server-status online';
                    statusEl.textContent = 'Server online';
                    setTimeout(() => statusEl.style.display = 'none', 2000);
                } else {
                    throw new Error('Server error');
                }
            } catch (e) {
                serverOnline = false;
                statusEl.className = 'server-status offline';
                statusEl.textContent = 'Server offline - please start the server';
                showInfo('Please start the server first: npm start');
            }
        }

        function initLangBar() {
            const bar = document.getElementById('langBar');
            if (!bar) return;
            const i18n = window.I18N;
            const current = i18n && typeof i18n.getCurrentLang === 'function' ? i18n.getCurrentLang() : { code: 'en' };
            const languages = i18n && Array.isArray(i18n.getLanguages?.()) ? i18n.getLanguages() : [{ code: 'en', name: 'English', flag: '🇬🇧' }];
            bar.innerHTML = languages.map(lang =>
                `<button class="lang-chip ${lang.code === current.code ? 'active' : ''}" onclick="changeLang('${SafeDOM.escapeAttribute(lang.code)}')">${SafeDOM.escapeHtml(lang.flag)} ${SafeDOM.escapeHtml(lang.name)}</button>`
            ).join('');
        }

        function changeLang(lang) {
            if (window.I18N && typeof window.I18N.setLang === 'function') {
                window.I18N.setLang(lang);
            }
            document.querySelectorAll('.lang-chip').forEach(chip => {
                chip.classList.toggle('active', chip.textContent.includes(lang));
            });
            applyTranslations();
        }

        function applyTranslations() {
            const i18n = window.I18N;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                let text = key;
                if (i18n && typeof i18n.t === 'function') {
                    text = i18n.t(key) || key;
                }
                if (text === key && key.includes('_')) {
                    text = key.split('_').slice(1).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                }
                if (el.tagName === 'INPUT') el.placeholder = text;
                else el.textContent = text;
            });
            if (i18n && i18n.currentLang) {
                document.documentElement.lang = i18n.currentLang;
            }
        }

        function showError(msg) { const el = document.getElementById('errorMsg'); el.textContent = msg; el.style.display = 'block'; document.getElementById('successMsg').style.display = 'none'; document.getElementById('infoMsg').style.display = 'none'; }
        function showSuccess(msg) { const el = document.getElementById('successMsg'); el.textContent = msg; el.style.display = 'block'; document.getElementById('errorMsg').style.display = 'none'; document.getElementById('infoMsg').style.display = 'none'; }
        function showInfo(msg) { const el = document.getElementById('infoMsg'); el.textContent = msg; el.style.display = 'block'; }
        function clearMessages() { document.getElementById('errorMsg').style.display = 'none'; document.getElementById('successMsg').style.display = 'none'; document.getElementById('infoMsg').style.display = 'none'; }

        function validateEmail(email) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email); }
        function validatePassword(password) { return password.length >= 6; }
        function checkPasswordStrength() {
            const pwd = document.getElementById('password').value;
            const bar = document.getElementById('passwordStrength');
            if (!pwd) { bar.className = 'password-strength'; return; }
            if (pwd.length < 6) bar.className = 'password-strength weak';
            else if (pwd.length < 10 || !/[A-Z]/.test(pwd) || !/[0-9]/.test(pwd)) bar.className = 'password-strength medium';
            else bar.className = 'password-strength strong';
        }

        let avatarData = null;

        function handleAvatarChange(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) { showError('Please select an image file'); return; }
            if (file.size > 500 * 1024) { showError('Image too large. Max 500KB allowed.'); return; }
            const reader = new FileReader();
            reader.onload = (ev) => {
                avatarData = ev.target.result;
                const preview = document.getElementById('avatarPreview');
                preview.style.backgroundImage = `url(${avatarData})`;
                preview.style.backgroundSize = 'cover';
                preview.style.backgroundPosition = 'center';
                preview.textContent = '';
                preview.classList.add('has-image');
            };
            reader.readAsDataURL(file);
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearMessages();

            if (!serverOnline) { showError('Server is offline. Please start the server first.'); return; }

            const btn = document.getElementById('registerBtn');
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            // Validation
            let hasError = false;
            document.querySelectorAll('input').forEach(i => i.classList.remove('error'));

            if (!firstName) { showError('First name is required'); document.getElementById('firstName').classList.add('error'); hasError = true; }
            else if (!lastName) { showError('Last name is required'); document.getElementById('lastName').classList.add('error'); hasError = true; }
            else if (!email) { showError('Email is required'); document.getElementById('email').classList.add('error'); hasError = true; }
            else if (!validateEmail(email)) { showError('Please enter a valid email address'); document.getElementById('email').classList.add('error'); hasError = true; }
            else if (!password) { showError('Password is required'); document.getElementById('password').classList.add('error'); hasError = true; }
            else if (!validatePassword(password)) { showError('Password must be at least 6 characters'); document.getElementById('password').classList.add('error'); hasError = true; }
            else if (password !== passwordConfirm) { showError('Passwords do not match'); document.getElementById('passwordConfirm').classList.add('error'); hasError = true; }

            if (hasError) return;

            if (btn.dataset.busy === 'true') return;
            btn.dataset.busy = 'true';
            setSubmitState(btn, true, I18N.t('register_loading'), I18N.t('register_button'));

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 10000);
                const res = await fetch(`${API_BASE}/session/register`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName, email, password, phone, avatar: avatarData }), signal: controller.signal, credentials: 'include'
                });
                clearTimeout(timeout);

                const data = await res.json();
                if (res.ok) {
                    if (data.token) localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    btn.dataset.busy = 'false';
                    setSubmitState(btn, false, I18N.t('register_loading'), I18N.t('register_button'));
                    showSuccess('Account created successfully! Redirecting...');
                    setTimeout(() => {
                        window.location.assign(new URL('/pages/login.html', APP_BASE).toString());
                    }, 1000);
                } else {
                    btn.dataset.busy = 'false';
                    setSubmitState(btn, false, I18N.t('register_loading'), I18N.t('register_button'));
                    showError(data.error || 'Registration failed. Please try again.');
                }
            } catch (err) {
                btn.dataset.busy = 'false';
                setSubmitState(btn, false, I18N.t('register_loading'), I18N.t('register_button'));
                if (err.name === 'AbortError') showError('Request timed out. Please try again.');
                else showError('Cannot connect to server. Please make sure the server is running.');
            }
        }
    </script>
</body>

</html>
